<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Blue Dog Rekenrace">
  <defs>
    <linearGradient id="lucht" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a6b"/>
      <stop offset="1" stop-color="#5aa9e6"/>
    </linearGradient>
    <clipPath id="rond">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rond)">
  <rect width="512" height="512" fill="url(#lucht)"/>

  <!-- Heuvel en baan -->
  <path d="M0 330 q 90 -60 180 -10 q 90 50 180 -10 q 90 -50 152 0 V512 H0 Z" fill="#3f7d5a"/>
  <rect y="384" width="512" height="128" fill="#4a3e2f"/>
  <g fill="#f2e9d8" opacity="0.55">
    <rect x="24" y="438" width="64" height="10" rx="5"/>
    <rect x="136" y="438" width="64" height="10" rx="5"/>
    <rect x="248" y="438" width="64" height="10" rx="5"/>
    <rect x="360" y="438" width="64" height="10" rx="5"/>
  </g>

  <!-- Blue Dog, dezelfde vormen als de sprite in het spel -->
  <g transform="translate(232 392) scale(3.1)">
    <ellipse cx="0" cy="1" rx="24" ry="4" fill="#000" opacity="0.25"/>
    <g stroke="#2a5ba8" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M-12 -14 L-5 -4 L-3 0"/>
      <path d="M10 -14 L3 -4 L1 0"/>
    </g>
    <path d="M-22 -22 q -10 -4 -8 -14" stroke="#3d7de0" stroke-width="5" stroke-linecap="round" fill="none"/>
    <ellipse cx="-2" cy="-22" rx="22" ry="13" fill="#3d7de0"/>
    <ellipse cx="-2" cy="-17" rx="16" ry="7" fill="#bcd8ff"/>
    <g stroke="#3d7de0" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M-4 -14 L3 -4 L5 0"/>
      <path d="M16 -14 L23 -4 L25 0"/>
    </g>
    <ellipse cx="18" cy="-28" rx="11" ry="10" fill="#3d7de0"/>
    <ellipse cx="27" cy="-25" rx="6" ry="5" fill="#bcd8ff"/>
    <ellipse cx="18" cy="-30" rx="5" ry="9" fill="#2a5ba8"/>
    <circle cx="32" cy="-25" r="2.5" fill="#0e1726"/>
    <circle cx="21" cy="-31" r="1.8" fill="#0e1726"/>
  </g>

  <!-- Rekenteken: waar het spel om draait -->
  <g fill="#ffcf3d" transform="translate(96 116)">
    <rect x="-8" y="-34" width="16" height="68" rx="8" transform="rotate(45)"/>
    <rect x="-34" y="-8" width="68" height="16" rx="8" transform="rotate(45)"/>
  </g>
  </g>
</svg>
