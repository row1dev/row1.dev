<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1726" />
    <meta name="description" content="Race tegen de klok en tegen elkaar: hoe sneller je rekent, hoe harder Blue Dog loopt." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Blue Dog Rekenrace</title>
  </head>
  <body>
    <main id="app">
      <!-- Startscherm -->
      <section class="screen" id="screen-menu">
        <h1 class="title">Blue Dog Rekenrace</h1>
        <div class="circuits" id="circuit-list"></div>
        <div class="menu-footer">
          <div class="field">
            <span class="field-label">Tegenstanders</span>
            <div class="chips" id="opponent-chips"></div>
          </div>
          <button class="chip mute" id="menu-mute" type="button" aria-pressed="false">
            <span aria-hidden="true">🔊</span> <span id="menu-mute-label">geluid aan</span>
          </button>
        </div>
      </section>

      <!-- Racescherm -->
      <section class="screen" id="screen-race" hidden>
        <header class="hud" id="hud">
          <span class="hud-position" id="hud-position">P1/2</span>
          <div class="hud-progress" id="hud-progress" role="img" aria-label="Voortgang">
            <div class="hud-progress-fill" id="hud-progress-fill"></div>
            <div class="hud-markers" id="hud-markers"></div>
          </div>
          <span class="hud-distance" id="hud-distance">0m</span>
          <span class="hud-time" id="hud-time">00:00</span>
          <span class="hud-streak" id="hud-streak">streak x0</span>
          <button class="hud-mute" id="hud-mute" type="button" aria-label="Geluid aan of uit" aria-pressed="false">🔊</button>
          <div class="hud-turbo" id="hud-turbo" hidden><div class="hud-turbo-fill" id="hud-turbo-fill"></div></div>
        </header>

        <div class="track">
          <canvas id="track-canvas"></canvas>
        </div>

        <div class="question" id="question">
          <span class="question-text" id="question-text">7 × 8 =</span>
          <span class="answer-box" id="answer-box" aria-live="polite"></span>
        </div>

        <div class="numpad" id="numpad"></div>
      </section>

      <!-- Resultaatscherm -->
      <section class="screen" id="screen-result" hidden>
        <h2 class="result-heading" id="result-heading">2e plaats <span id="result-time">01:38</span></h2>
        <dl class="result-stats" id="result-stats"></dl>
        <p class="result-record" id="result-record" hidden>Nieuw persoonlijk record</p>
        <div class="result-buttons">
          <button class="big-button" id="result-again" type="button">Opnieuw</button>
          <button class="big-button ghost" id="result-menu" type="button">Ander circuit</button>
        </div>
      </section>
    </main>

    <!-- Draai-je-telefoon-overlay -->
    <div class="portrait-hint" id="portrait-hint" hidden>
      <svg viewBox="0 0 64 64" width="96" height="96" aria-hidden="true">
        <rect x="20" y="6" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="3" />
        <circle cx="32" cy="44" r="2" fill="currentColor" />
        <path d="M14 56 a22 22 0 0 0 36 -6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        <path d="M48 44 l4 7 -8 1 z" fill="currentColor" />
      </svg>
      <p>Draai je telefoon</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
